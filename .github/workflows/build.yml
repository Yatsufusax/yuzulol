name: Compilar YuzuLOL

# Se ejecuta solo al subir cambios, o a mano desde la pestaña "Actions" > "Run workflow".
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  exe-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "Instalar y compilar el .exe (Electron, ventana propia sin navegador)"
        working-directory: lol-companion
        run: |
          npm install
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: YuzuLOL-exe
          path: lol-companion/dist/YuzuLOL.exe

  apk-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # El runner ya trae el SDK de Android: no hace falta android-actions/setup-android
      # (era lo que fallaba con "Failed to find package 'tools'"). Solo se aceptan las licencias.
      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Crear el proyecto Android
        working-directory: lol-companion/android-app
        run: |
          npm install
          npx cap add android
          # Permiso de cámara (sin esto Android no muestra el aviso) y descarga automática del escáner de Google
          MF=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $MF || sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' $MF
          sed -i 's|</application>|    <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />\n    </application>|' $MF
          # Icono de la app
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
          cp -r resources/res/. android/app/src/main/res/
          # El escáner de QR necesita Android 6 (API 23) como mínimo
          sed -i 's/minSdkVersion = 2[0-9]/minSdkVersion = 23/' android/variables.gradle
          npx cap sync android
      - name: Compilar el APK
        working-directory: lol-companion/android-app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: YuzuLOL-apk
          path: lol-companion/android-app/android/app/build/outputs/apk/debug/app-debug.apk
